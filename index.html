const code={fn:`def area(length, breadth=1):\n    """Return the area of a rectangle."""\n    return length * breadth\n\nprint(area(5, 3))       # positional\nprint(area(length=5))   # default breadth`,text:`with open("notes.txt", "r") as f:\n    for line in f:\n        words = line.split()\n        print("#".join(words))`,binary:`import pickle\n\nwith open("students.dat", "wb") as f:\n    pickle.dump({"roll": 12, "name": "Asha", "marks": 91}, f)\n\nwith open("students.dat", "rb") as f:\n    record = pickle.load(f)\n    print(record)`,csv:`import csv\n\nwith open("users.csv", "w", newline="") as f:\n    writer = csv.writer(f)\n    writer.writerow(["user_id", "password"])\n    writer.writerows([["u01", "py123"], ["u02", "sql456"]])`,stack:`stack = []\n\ndef push(item):\n    stack.append(item)\n\ndef pop():\n    return stack.pop() if stack else "Underflow"\n\npush("A"); push("B")\nprint(pop())  # B — LIFO`,sql:`CREATE TABLE Student(\n  roll INT PRIMARY KEY,\n  name VARCHAR(30) NOT NULL,\n  marks FLOAT\n);\n\nSELECT name, marks\nFROM Student\nWHERE marks >= 75\nORDER BY marks DESC;`,join:`SELECT s.name, c.course_name\nFROM Student AS s\nJOIN Course AS c\n  ON s.course_id = c.course_id;`,pySQL:`import mysql.connector\n\ncon = mysql.connector.connect(host="localhost",\n    user="root", password="pass", database="school")\ncur = con.cursor()\ncur.execute("SELECT * FROM Student WHERE marks >= %s", (75,))\nfor row in cur.fetchall(): print(row)\ncon.close()`};
const pages={
 home:{title:'Learn the syllabus. Own the paper.',sub:'A visual, exam-first course for CBSE Computer Science (083). Every topic is split into a focused lesson with examples, pitfalls, practicals and quick checks.',group:'Home',kind:'home'},
 revision:{title:'Python XI revision',sub:'The toolkit your Class XII programs assume: strings, lists, dictionaries, loops, operators and modules.',group:'Unit 1 • Programming',kind:'lesson',body:`<h2>Why revise this first?</h2><p>Board questions rarely test a new feature in isolation. They combine a loop with a string, a list with a function, or a file with a condition. Revise the small building blocks so your attention stays on the logic.</p><div class="callout blue"><strong>Exam lens</strong>Trace the value of every variable after each iteration. Write the state table before you code when a question feels confusing.</div><h2>High-yield checklist</h2><div class="checklist"><label class="check"><input type="checkbox">Strings: indexing, slicing, <code>split()</code>, <code>join()</code>, <code>find()</code>, <code>replace()</code>, case methods</label><label class="check"><input type="checkbox">Lists: mutation, <code>append()</code>, <code>insert()</code>, <code>pop()</code>, <code>remove()</code>, sorting</label><label class="check"><input type="checkbox">Dictionaries: keys, values, <code>items()</code>, update and safe lookup</label><label class="check"><input type="checkbox">Loops, nested loops, range boundaries and Boolean operators</label></div><h2>Common board traps</h2><ul><li><code>range(a, b)</code> stops before <code>b</code>.</li><li><code>list.sort()</code> changes the list and returns <code>None</code>; <code>sorted(list)</code> returns a new list.</li><li>Strings are immutable; methods return a new string.</li><li>Use <code>==</code> for comparison, not <code>=</code>.</li></ul>`},
 functions:{title:'Functions: make logic reusable',sub:'From built-ins to user-defined functions—parameters, arguments, return values, flow and scope.',group:'Unit 1 • Programming',kind:'lesson',body:`<h2>Three families of functions</h2><div class="table-wrap"><table class="table"><tr><th>Type</th><th>Examples</th><th>What to remember</th></tr><tr><td>Built-in</td><td><code>len()</code>, <code>max()</code>, <code>sum()</code></td><td>Available without importing a module.</td></tr><tr><td>Module function</td><td><code>math.sqrt()</code>, <code>random.randint()</code></td><td>Import the module, then use its namespace.</td></tr><tr><td>User-defined</td><td><code>def average(...)</code></td><td>You design the name, inputs and output.</td></tr></table></div><h2>Parameters versus arguments</h2><p>A <b>parameter</b> is the variable in the function definition. An <b>argument</b> is the actual value supplied at the call site. Positional arguments follow order; keyword arguments use names; default parameters provide a value when one is omitted.</p><pre class="code">${code.fn}</pre><div class="callout orange"><strong>Scoring detail</strong>Put non-default parameters before default parameters. <code>def f(a=1, b)</code> is invalid, while <code>def f(a, b=1)</code> is valid.</div><h2>Return and flow of execution</h2><p>Python starts at the first top-level statement, jumps into a function only when called, executes its indented body, and returns to the line after the call. <code>return</code> ends the function immediately. Multiple values are returned as a tuple.</p><pre class="code">def stats(a, b):\n    return a + b, a - b\n\nsum_value, difference = stats(8, 3)</pre><h2>Scope</h2><p>A local variable exists inside its function. A global variable is defined outside functions. Reading a global is possible inside a function, but assigning to it creates a local unless you explicitly use <code>global</code>. Prefer passing data and returning results—it is safer and easier to test.</p>`},
 exceptions:{title:'Exception handling',sub:'Keep programs graceful when input, files or conversions fail.',group:'Unit 1 • Programming',kind:'lesson',body:`<h2>Errors versus exceptions</h2><p>A syntax error prevents a program from starting. An exception happens during execution: <code>ValueError</code> for bad conversion, <code>FileNotFoundError</code> for a missing file, <code>ZeroDivisionError</code> for division by zero.</p><pre class="code">try:\n    marks = int(input("Marks: "))\n    print(100 / marks)\nexcept ValueError:\n    print("Enter a whole number.")\nexcept ZeroDivisionError:\n    print("Marks cannot be zero here.")\nfinally:\n    print("This always runs.")</pre><h2>The three blocks</h2><ul><li><b>try:</b> code that may raise an exception.</li><li><b>except:</b> recovery code. Catch specific exception classes first.</li><li><b>finally:</b> cleanup that must happen whether the operation succeeds or fails.</li></ul><div class="callout red"><strong>Avoid</strong><code>except:</code> with no exception type in board answers unless you have a clear reason—it hides unrelated bugs.</div>`},
 files:{title:'Files & paths: persistent data',sub:'Text, binary and CSV files; modes, safe opening, pointers and CRUD-style operations.',group:'Unit 1 • Programming',kind:'lesson',body:`<h2>Paths</h2><p>An absolute path starts from the root (for example, <code>C:\\School\\data.txt</code>); a relative path starts from the current working directory (for example, <code>data\\data.txt</code>). Relative paths make a project portable.</p><h2>Choose the right file</h2><div class="table-wrap"><table class="table"><tr><th>File</th><th>Stores</th><th>Python tool</th></tr><tr><td>Text</td><td>Readable characters and lines</td><td><code>open()</code>, <code>read()</code></td></tr><tr><td>Binary</td><td>Objects/bytes, not directly human-readable</td><td><code>pickle.dump/load</code></td></tr><tr><td>CSV</td><td>Rows and columns separated by delimiters</td><td><code>csv.reader/writer</code></td></tr></table></div><h2>Modes at a glance</h2><p><code>r</code> read existing • <code>w</code> write/truncate • <code>a</code> append • <code>r+</code> read/write existing • <code>w+</code> create/truncate and read/write • <code>a+</code> append and read. Add <code>b</code> for binary, such as <code>rb</code>.</p><div class="callout blue"><strong>Best practice</strong>Use <code>with open(...)</code>. Python closes the file automatically even if an exception occurs.</div>`},
 text:{title:'Text files',sub:'Read, write, append and manipulate lines without losing marks to tiny syntax errors.',group:'Unit 1 • Programming',kind:'lesson',body:`<h2>Reading patterns</h2><pre class="code">with open("notes.txt", "r") as f:\n    data = f.read()       <span class="comment"># one string</span>\n    # or: line = f.readline()\n    # or: lines = f.readlines()</pre><p><code>read()</code> returns all content, <code>readline()</code> returns one line, and <code>readlines()</code> returns a list of lines. Iterating over the file is memory-friendly.</p><pre class="code">${code.text}</pre><h2>Writing and appending</h2><pre class="code">with open("out.txt", "w") as f:\n    f.write("First line\\n")\n    f.writelines(["A\\n", "B\\n"])\n\nwith open("out.txt", "a") as f:\n    f.write("Added later\\n")</pre><h2>Pointer methods</h2><p><code>tell()</code> reports the current byte position. <code>seek(n)</code> moves the pointer to position <code>n</code>. After reading a file, <code>seek(0)</code> moves back to the beginning.</p>`},
 binary:{title:'Binary files with pickle',sub:'Create, search and update structured records using dump() and load().',group:'Unit 1 • Programming',kind:'lesson',body:`<h2>Why binary?</h2><p>Pickle serializes a Python object into bytes. It is useful for records such as dictionaries or lists, but it is not human-readable and should only be loaded from trusted sources.</p><pre class="code">${code.binary}</pre><h2>Search pattern</h2><p>Open in <code>rb</code>, repeatedly call <code>pickle.load(file)</code> until <code>EOFError</code>, compare the key field, and stop when found. Use a <code>found</code> flag for a clear “not found” message.</p><h2>Update pattern</h2><ol><li>Read every record into a list.</li><li>Change the matching record.</li><li>Reopen with <code>wb</code> and dump all records back.</li></ol><div class="callout orange"><strong>Board trap</strong>Do not use <code>while record:</code> as an EOF test. The standard end-of-file signal for pickle is <code>EOFError</code>.</div>`},
 csv:{title:'CSV files',sub:'Represent tabular data with a standard comma-separated format.',group:'Unit 1 • Programming',kind:'lesson',body:`<h2>Writing rows</h2><pre class="code">${code.csv}</pre><p><code>writerow()</code> writes one row; <code>writerows()</code> writes an iterable of rows. When opening a CSV on Windows, <code>newline=""</code> avoids blank lines between records.</p><h2>Reading and searching</h2><pre class="code">with open("users.csv", newline="") as f:\n    reader = csv.reader(f)\n    next(reader)  <span class="comment"># skip header</span>\n    for user_id, password in reader:\n        if user_id == target:\n            print(password)\n            break</pre><div class="callout green"><strong>Think in records</strong>Each row is a list of strings. Convert numeric fields explicitly with <code>int()</code> or <code>float()</code> before comparing.</div>`},
 stack:{title:'Stacks using a list',sub:'The LIFO structure behind undo, browser history and expression processing.',group:'Unit 1 • Programming',kind:'lesson',body:`<h2>Core idea</h2><p>A stack follows <b>LIFO</b>: Last In, First Out. <b>Push</b> inserts at the top; <b>pop</b> removes and returns the top item. A pop on an empty stack is <b>underflow</b>.</p><pre class="code">${code.stack}</pre><div class="table-wrap"><table class="table"><tr><th>Operation</th><th>List method</th><th>Result</th></tr><tr><td>Push</td><td><code>append(item)</code></td><td>Adds at top</td></tr><tr><td>Pop</td><td><code>pop()</code></td><td>Removes top</td></tr><tr><td>Peek</td><td><code>stack[-1]</code></td><td>Views top without removing</td></tr><tr><td>Underflow check</td><td><code>if not stack</code></td><td>Prevents invalid pop</td></tr></table></div><div class="callout blue"><strong>Exam habit</strong>Draw the stack vertically and annotate the top after every push/pop before writing output.</div>`},
 network:{title:'Computer networks',sub:'Move from ARPANET to today’s web, then connect devices, topologies, protocols and services.',group:'Unit 2 • Networks',kind:'lesson',body:`<h2>Unit map</h2><p>This unit is worth <b>10 marks</b>, but it is rich in one-mark definitions and compare-and-contrast questions. Learn the exact expansion, purpose and one distinguishing feature for every term.</p><div class="grid"><div class="card"><h3>Evolution</h3><p>ARPANET → NSFNET → Internet</p></div><div class="card"><h3>Communication</h3><p>Sender, receiver, message, medium, protocol</p></div><div class="card"><h3>Infrastructure</h3><p>Cables, radio, modem, switch, router</p></div><div class="card"><h3>Architecture</h3><p>PAN, LAN, MAN, WAN + topologies</p></div><div class="card"><h3>Protocols</h3><p>HTTP, FTP, SMTP, TCP/IP, HTTPS…</p></div><div class="card"><h3>Web services</h3><p>WWW, HTML, XML, URL and hosting</p></div></div><div class="callout orange"><strong>Scoring formula</strong>For a device/protocol answer: write full form (if applicable) + role + one example or contrast.</div>`},
 evolution:{title:'Evolution of networking',sub:'A short timeline that explains why the Internet looks the way it does.',group:'Unit 2 • Networks',kind:'lesson',body:`<h2>Timeline</h2><div class="table-wrap"><table class="table"><tr><th>Stage</th><th>Idea</th><th>Exam cue</th></tr><tr><td>ARPANET</td><td>Early packet-switched research network funded by ARPA.</td><td>Foundation of modern networking.</td></tr><tr><td>NSFNET</td><td>Academic backbone that expanded high-speed interconnection.</td><td>Helped connect research institutions.</td></tr><tr><td>Internet</td><td>Global network of interconnected networks using common protocols.</td><td>Not the same as the Web.</td></tr></table></div><p>The <b>Internet</b> is the infrastructure/network. The <b>World Wide Web</b> is a service that uses the Internet to deliver linked documents and media.</p>`},
 communication:{title:'Data communication',sub:'The vocabulary behind every message travelling across a network.',group:'Unit 2 • Networks',kind:'lesson',body:`<h2>Five components</h2><ol><li><b>Sender</b> creates the message.</li><li><b>Receiver</b> gets and interprets it.</li><li><b>Message</b> is the information.</li><li><b>Communication medium</b> is the path.</li><li><b>Protocol</b> is the agreed rule set.</li></ol><h2>Capacity and addressing</h2><p><b>Bandwidth</b> is the capacity of a channel, usually measured in bits per second. <b>Data transfer rate</b> is the actual speed achieved. An <b>IP address</b> identifies a device/interface on a network so data can be routed.</p><h2>Switching</h2><div class="table-wrap"><table class="table"><tr><th>Circuit switching</th><th>Packet switching</th></tr><tr><td>Dedicated path for the whole session.</td><td>Message split into packets; packets may take different paths.</td></tr><tr><td>Predictable, but wastes capacity when idle.</td><td>Efficient and resilient; packets are reassembled.</td></tr></table></div>`},
 media:{title:'Transmission media',sub:'Compare wired reliability with wireless mobility.',group:'Unit 2 • Networks',kind:'lesson',body:`<h2>Wired media</h2><div class="table-wrap"><table class="table"><tr><th>Medium</th><th>Strength</th><th>Limitation</th></tr><tr><td>Twisted pair</td><td>Cheap, easy to install</td><td>More interference / shorter distance</td></tr><tr><td>Co-axial</td><td>Better shielding and bandwidth</td><td>Bulkier than twisted pair</td></tr><tr><td>Fiber-optic</td><td>Very high speed, long distance, EMI-resistant</td><td>Costly and delicate installation</td></tr></table></div><h2>Wireless media</h2><p><b>Radio waves</b> cover broad areas and can penetrate walls. <b>Microwaves</b> are directional and often require line-of-sight. <b>Infrared</b> works over short distances and generally cannot pass through walls.</p>`},
 devices:{title:'Network devices',sub:'Know what each box does—and what it does not do.',group:'Unit 2 • Networks',kind:'lesson',body:`<div class="table-wrap"><table class="table"><tr><th>Device</th><th>Role</th></tr><tr><td>Modem</td><td>Modulates/demodulates signals to connect to an ISP.</td></tr><tr><td>Repeater</td><td>Regenerates a weak signal to extend distance.</td></tr><tr><td>Hub</td><td>Broadcasts incoming data to all ports.</td></tr><tr><td>Switch</td><td>Forwards frames to the intended device/port in a LAN.</td></tr><tr><td>Router</td><td>Connects networks and forwards packets using IP addresses.</td></tr><tr><td>Gateway</td><td>Connects dissimilar networks/protocol environments.</td></tr><tr><td>Ethernet/Wi‑Fi card</td><td>Network interface that lets a computer communicate.</td></tr><tr><td>RJ45</td><td>Connector commonly used with Ethernet twisted-pair cable.</td></tr></table></div><div class="callout blue"><strong>Compare</strong>Hub repeats to everyone; switch learns addresses; router chooses a path between networks.</div>`},
 topology:{title:'Network types & topologies',sub:'Scale tells you “how large”; topology tells you “how connected”.',group:'Unit 2 • Networks',kind:'lesson',body:`<h2>Types by area</h2><p><b>PAN</b> personal range • <b>LAN</b> building/campus • <b>MAN</b> city • <b>WAN</b> country/continent. The Internet is the best-known WAN-like interconnection.</p><h2>Topologies</h2><div class="table-wrap"><table class="table"><tr><th>Topology</th><th>Shape</th><th>Key implication</th></tr><tr><td>Bus</td><td>One shared backbone</td><td>Simple, but a backbone fault affects the network.</td></tr><tr><td>Star</td><td>All nodes to a central device</td><td>Easy to manage; central device is critical.</td></tr><tr><td>Tree</td><td>Hierarchical stars</td><td>Scalable, structured; upper-level failure affects branches.</td></tr></table></div>`},
 protocols:{title:'Network protocols',sub:'Rules with a job: delivery, browsing, files, mail or calls.',group:'Unit 2 • Networks',kind:'lesson',body:`<div class="table-wrap"><table class="table"><tr><th>Protocol</th><th>Use</th></tr><tr><td>HTTP / HTTPS</td><td>Web transfer / encrypted web transfer</td></tr><tr><td>FTP</td><td>File transfer</td></tr><tr><td>SMTP</td><td>Sending email</td></tr><tr><td>POP3</td><td>Retrieving email to a client</td></tr><tr><td>TCP/IP</td><td>Reliable transport + Internet addressing/routing suite</td></tr><tr><td>PPP</td><td>Point-to-point data-link communication</td></tr><tr><td>TELNET</td><td>Remote text login; insecure compared with SSH</td></tr><tr><td>VoIP</td><td>Voice communication over IP networks</td></tr></table></div><div class="callout orange"><strong>Easy distinction</strong>SMTP sends mail; POP3 retrieves mail. HTTPS is HTTP with security, not a different kind of website.</div>`},
 web:{title:'Web services',sub:'Decode the web stack: WWW, HTML, XML, domains, URLs, browsers, servers and hosting.',group:'Unit 2 • Networks',kind:'lesson',body:`<h2>Key terms</h2><ul><li><b>WWW:</b> interlinked resources accessed over the Internet.</li><li><b>HTML:</b> markup language that structures web pages.</li><li><b>XML:</b> extensible markup for storing/transporting structured data.</li><li><b>Domain name:</b> human-readable name mapped to an IP address.</li><li><b>URL:</b> address of a resource, including protocol and location.</li><li><b>Web browser:</b> client software that requests and renders pages.</li><li><b>Web server:</b> software/computer that responds to requests.</li><li><b>Web hosting:</b> service that stores site files and makes them reachable.</li></ul><pre class="code">https://example.com:443/learn/index.html\n│      │           │   └── resource path\n│      │           └────── port\n│      └────────────────── domain\n└───────────────────────── protocol</pre>`},
 db:{title:'Database concepts',sub:'Why databases exist, and the vocabulary that makes the rest of Unit 3 precise.',group:'Unit 3 • Database',kind:'lesson',body:`<h2>Why a DBMS?</h2><p>A database organizes related data so it can be stored, searched, updated and shared consistently. A DBMS provides controlled access, reduces unnecessary duplication and supports constraints, queries and concurrent users.</p><div class="callout blue"><strong>Remember</strong>Database = organized collection of data. DBMS = software that manages it. SQL = language used to define and manipulate relational data.</div><h2>Relational vocabulary</h2><div class="table-wrap"><table class="table"><tr><th>Term</th><th>Meaning</th></tr><tr><td>Relation</td><td>Table</td></tr><tr><td>Attribute</td><td>Column/field</td></tr><tr><td>Tuple</td><td>Row/record</td></tr><tr><td>Domain</td><td>Allowed set/type of values for an attribute</td></tr><tr><td>Degree</td><td>Number of attributes/columns</td></tr><tr><td>Cardinality</td><td>Number of tuples/rows</td></tr></table></div>`},
 keys:{title:'Keys & relational model',sub:'Make uniqueness and relationships explicit.',group:'Unit 3 • Database',kind:'lesson',body:`<h2>Keys</h2><ul><li><b>Candidate key:</b> minimal attribute set that uniquely identifies a row.</li><li><b>Primary key:</b> chosen candidate key; unique and not NULL.</li><li><b>Alternate key:</b> candidate key not chosen as primary.</li><li><b>Foreign key:</b> attribute that refers to a key in another table, creating a relationship.</li></ul><pre class="code">Student(roll, name, email, class_id)\n          ↑          ↑\n      primary     alternate\n\nClass(class_id, class_name)\n      ↑\n  referenced key</pre><div class="callout green"><strong>Design test</strong>If you can have two rows with the same value, it cannot be the primary key by itself.</div>`},
 sql:{title:'SQL foundations',sub:'DDL builds the structure; DML changes the data.',group:'Unit 3 • Database',kind:'lesson',body:`<h2>DDL and DML</h2><p><b>DDL</b> defines structure: <code>CREATE</code>, <code>ALTER</code>, <code>DROP</code>. <b>DML</b> works with rows: <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>, <code>SELECT</code>.</p><pre class="code">${code.sql}</pre><h2>Types and constraints</h2><p><code>CHAR(n)</code> fixed length • <code>VARCHAR(n)</code> variable length • <code>INT</code> whole number • <code>FLOAT</code> decimal • <code>DATE</code> date. <code>NOT NULL</code> requires a value; <code>UNIQUE</code> prevents duplicates; <code>PRIMARY KEY</code> combines uniqueness and non-null identity.</p><div class="callout red"><strong>Safety</strong>Never write an UPDATE or DELETE without checking the WHERE clause. Without WHERE, every row is affected.</div>`},
 queries:{title:'SQL queries & filters',sub:'Turn a question into SELECT, WHERE, aliases, ordering and conditions.',group:'Unit 3 • Database',kind:'lesson',body:`<h2>Query recipe</h2><ol><li>Choose columns after <code>SELECT</code>.</li><li>Choose table after <code>FROM</code>.</li><li>Filter rows with <code>WHERE</code>.</li><li>Sort with <code>ORDER BY column ASC/DESC</code>.</li></ol><pre class="code">SELECT DISTINCT class AS section, name\nFROM Student\nWHERE marks BETWEEN 75 AND 95\n  AND city IN ('Muscat', 'Delhi')\n  AND email LIKE '%@school.edu'\nORDER BY marks DESC;</pre><h2>NULL is not zero</h2><p>NULL means missing/unknown. Never use <code>marks = NULL</code>; use <code>IS NULL</code> or <code>IS NOT NULL</code>. Mathematical operations with NULL generally remain NULL.</p><h2>Operators</h2><p>Arithmetic: <code>+ - * / %</code> • relational: <code>= &lt;&gt; &lt; &gt; &lt;= &gt;=</code> • logical: <code>AND OR NOT</code>. Use parentheses when mixing conditions.</p>`},
 aggregate:{title:'Aggregates, GROUP BY & HAVING',sub:'Summarize rows without losing the logic of groups.',group:'Unit 3 • Database',kind:'lesson',body:`<p>Aggregate functions return one value from many rows: <code>MAX</code>, <code>MIN</code>, <code>AVG</code>, <code>SUM</code>, <code>COUNT</code>. <code>COUNT(*)</code> counts rows; <code>COUNT(column)</code> ignores NULL in that column.</p><pre class="code">SELECT class, AVG(marks) AS average_marks, COUNT(*) AS students\nFROM Student\nGROUP BY class\nHAVING AVG(marks) >= 75;</pre><div class="callout blue"><strong>WHERE vs HAVING</strong>WHERE filters individual rows before grouping. HAVING filters groups after aggregate calculation.</div><h2>Aliasing and DISTINCT</h2><p><code>AS</code> gives a readable temporary name. <code>DISTINCT</code> removes duplicate result rows. Neither changes the stored table.</p>`},
 joins:{title:'Joins',sub:'Combine related tables without accidentally creating nonsense rows.',group:'Unit 3 • Database',kind:'lesson',body:`<h2>Cartesian product</h2><p>A Cartesian product pairs every row in table A with every row in table B. It is produced by <code>FROM A, B</code> without a join condition and is usually much larger than intended.</p><h2>Equi-join and natural join</h2><pre class="code">${code.join}</pre><p>An <b>equi-join</b> matches columns using equality in an <code>ON</code> condition. A <b>natural join</b> automatically matches same-named columns and returns one copy of the common column. Use aliases to keep multi-table queries readable.</p><div class="callout orange"><strong>Board trap</strong>Joining on the wrong columns can return plausible-looking but incorrect output. Identify the key/foreign-key pair first.</div>`},
 pysq:{title:'Python–SQL connectivity',sub:'Connect, execute, commit and fetch—then build a tiny database application.',group:'Unit 3 • Database',kind:'lesson',body:`<h2>The cursor workflow</h2><ol><li><code>connect()</code> to the database.</li><li>Create a <code>cursor()</code>.</li><li>Use <code>execute()</code> for the query.</li><li>Use <code>commit()</code> after INSERT/UPDATE/DELETE.</li><li>Use <code>fetchone()</code> or <code>fetchall()</code> for SELECT.</li><li>Read <code>rowcount</code> when asked how many rows changed.</li></ol><pre class="code">${code.pySQL}</pre><h2>Parameterized queries</h2><p>With MySQL Connector, use <code>%s</code> placeholders and pass values separately: <code>cursor.execute("... WHERE roll=%s", (roll,))</code>. This is safer and avoids quoting mistakes. If your school setup teaches <code>format()</code>, ensure strings are quoted correctly and validate input.</p><div class="callout green"><strong>Practical marks</strong>Close the cursor/connection, show clear prompts, handle invalid input, and commit modifications explicitly.</div>`},
 practical:{title:'Practical & project playbook',sub:'Secure the 30 practical marks: lab test, report, project and viva.',group:'Practical',kind:'lesson',body:`<h2>Mark map</h2><div class="stats"><div class="stat"><b>12</b><span>Lab test</span></div><div class="stat"><b>7</b><span>Report file</span></div><div class="stat"><b>8</b><span>Project</span></div><div class="stat"><b>3</b><span>Viva voce</span></div></div><h2>Submission checklist</h2><div class="checklist"><label class="check"><input type="checkbox">15+ Python programs with aim, algorithm, code and output</label><label class="check"><input type="checkbox">5 SQL sets using one/two tables</label><label class="check"><input type="checkbox">4 Python–SQL connectivity programs</label><label class="check"><input type="checkbox">Project solves a real problem and credits sources</label><label class="check"><input type="checkbox">Can explain every line you submit</label></div><h2>Project ideas</h2><p>Library circulation, school inventory, local-business invoice generator, clinic queue, accessible quiz app. Start with a real user problem, define tables/records, build a small working version, test edge cases and document design decisions.</p><div class="callout orange"><strong>Viva drill</strong>For each program answer: What is the input? What is the output? Why this mode/query? What happens for empty or invalid data?</div>`}
};

const deepDive={
revision:`<div class="deep-pack"><div class="eyebrow">Deep dive • prerequisite mastery</div><h2>Core types and operators</h2><p>Python has integer, float, Boolean and string values, plus collections such as list, tuple and dictionary. The operator <code>/</code> always produces a float, while <code>//</code> gives floor division. <code>%</code> gives the remainder and is useful for digit extraction and even/odd tests.</p><pre class="code">n = 472\nlast = n % 10       # 2\nquotient = n // 10  # 47\nprint(7 // 2, 7 / 2)  # 3 3.5</pre><h2>Trace tables: the safest board method</h2><p>For output questions, make columns for loop variable, changed variables and printed value. Update one row per iteration; never mentally skip a loop boundary.</p><table class="table"><tr><th>i</th><th>total before</th><th>operation</th><th>total after</th></tr><tr><td>1</td><td>0</td><td>0 + 1</td><td>1</td></tr><tr><td>2</td><td>1</td><td>1 + 2</td><td>3</td></tr><tr><td>3</td><td>3</td><td>3 + 3</td><td>6</td></tr></table><div class="callout green"><strong>Board-ready answer</strong>Write the final output exactly, including spaces, brackets, quotes and line breaks. Then add one short reason if the question asks “explain”.</div></div>`,
functions:`<div class="deep-pack"><div class="eyebrow">Deep dive • definitions + solved patterns</div><h2>Four ways to call a function</h2><pre class="code">def introduce(name, city="Muscat"):\n    return name + " from " + city\n\nintroduce("Asha")                    # positional + default\nintroduce("Asha", "Delhi")           # two positional\nintroduce(name="Asha")                # keyword + default\nintroduce(city="Delhi", name="Asha") # keyword order may change</pre><p>Parameters receive values in the order Python matches them. Positional arguments must come before keyword arguments. A default parameter is evaluated when the function is called without that argument.</p><h2>Returning one value versus many</h2><pre class="code">def divide(a, b):\n    if b == 0:\n        return None\n    return a // b, a % b\n\nquotient, remainder = divide(17, 5)</pre><p>Multiple returns are packed into a tuple. If no return statement runs, the function returns <code>None</code>. Printing a value is not the same as returning it: printed output cannot be stored by the caller.</p><h2>Flow-of-execution example</h2><pre class="code">def double(x):\n    print("inside")\n    return x * 2\n\nprint("start")\ny = double(4)\nprint(y)</pre><p>Output: <code>start</code>, then <code>inside</code>, then <code>8</code>. Python reaches the call, enters the function, returns 8, assigns it to <code>y</code>, and resumes.</p><h2>Scope demonstration</h2><pre class="code">x = 10\ndef change():\n    x = 20       # local x\n    return x\nprint(change(), x)  # 20 10</pre><div class="callout orange"><strong>Common 3-mark mistake</strong>Do not say “global variables can never be used inside a function.” They can be read. Assignment creates a local name unless <code>global x</code> is used.</div></div>`,
exceptions:`<div class="deep-pack"><div class="eyebrow">Deep dive • robust programs</div><h2>Exception hierarchy you should recognise</h2><table class="table"><tr><th>Exception</th><th>Typical cause</th><th>Recovery</th></tr><tr><td>ValueError</td><td><code>int("abc")</code></td><td>Ask for valid numeric input</td></tr><tr><td>TypeError</td><td>Adding string and integer</td><td>Convert or correct types</td></tr><tr><td>ZeroDivisionError</td><td><code>10 / 0</code></td><td>Reject zero denominator</td></tr><tr><td>FileNotFoundError</td><td>Opening a missing path in r mode</td><td>Check filename or create it</td></tr><tr><td>EOFError</td><td>Reading pickle past the end</td><td>Stop the read loop</td></tr></table><h2>Validation loop</h2><pre class="code">try:\n    age = int(input("Age: "))\n    print("Age entered:", age)\nexcept ValueError:\n    print("Enter a whole number")\nfinally:\n    print("Input attempt complete")</pre><p>The try block contains the risky conversion; except handles invalid text; finally runs after either path.</p><h2>Finally and file cleanup</h2><pre class="code">f = None\ntry:\n    f = open("marks.txt")\n    print(f.read())\nexcept FileNotFoundError:\n    print("File missing")\nfinally:\n    if f is not None:\n        f.close()</pre><div class="callout blue"><strong>Preferred answer</strong>For files, use <code>with open()</code>; it already guarantees closure and is shorter to explain.</div></div>`,
files:`<div class="deep-pack"><div class="eyebrow">Deep dive • choose modes correctly</div><h2>Mode decision table</h2><table class="table"><tr><th>Mode</th><th>Must exist?</th><th>Old content</th><th>Pointer at</th></tr><tr><td>r</td><td>Yes</td><td>Preserved</td><td>Beginning</td></tr><tr><td>w</td><td>No</td><td>Erased/truncated</td><td>Beginning</td></tr><tr><td>a</td><td>No</td><td>Preserved</td><td>End</td></tr><tr><td>r+</td><td>Yes</td><td>Preserved</td><td>Beginning</td></tr><tr><td>w+</td><td>No</td><td>Erased/truncated</td><td>Beginning</td></tr><tr><td>a+</td><td>No</td><td>Preserved</td><td>End for writing</td></tr></table><h2>Text, binary and CSV: when to use which</h2><p>Use text for paragraphs and line-oriented content. Use binary/pickle for Python records when preserving object structure matters. Use CSV when data is rectangular and should be exchangeable with spreadsheet software. A CSV value is read as text, even if it looks numeric.</p><div class="callout blue"><strong>Path examples</strong>Relative path: <code>data/students.txt</code> starts from the current folder. Absolute path: <code>C:/School/data/students.txt</code> starts from the drive/root. For the board, remember the distinction and write the path directly in <code>open()</code>.</div><div class="callout red"><strong>Never forget</strong><code>w</code> destroys existing contents. If the question says “add”, choose <code>a</code>, not <code>w</code>.</div></div>`,
text:`<div class="deep-pack"><div class="eyebrow">Deep dive • text-file question patterns</div><h2>Pattern 1: count character categories</h2><pre class="code">vowels = consonants = upper = lower = 0\nwith open("story.txt") as f:\n    for line in f:\n        for ch in line:\n            if ch.isalpha():\n                if ch.lower() in "aeiou": vowels += 1\n                else: consonants += 1\n            if ch.isupper(): upper += 1\n            if ch.islower(): lower += 1</pre><p>Check alphabetic status before calling a character a consonant; spaces, digits and punctuation are neither.</p><h2>Pattern 2: remove lines containing a character</h2><pre class="code">with open("source.txt") as src, open("clean.txt", "w") as dst:\n    for line in src:\n        if 'a' not in line:\n            dst.write(line)</pre><h2>Manipulating the pointer</h2><pre class="code">with open("notes.txt", "r+") as f:\n    first = f.readline()\n    position = f.tell()\n    f.seek(0)\n    all_text = f.read()</pre><p><code>tell()</code> reports a position; <code>seek()</code> moves it. After <code>read()</code> returns all text, another read returns an empty string unless you seek back.</p><div class="callout green"><strong>Output marks</strong>Use <code>line.rstrip()</code> when you need to remove the newline, but do not accidentally remove meaningful spaces with <code>strip()</code> unless the question allows it.</div></div>`,
binary:`<div class="deep-pack"><div class="eyebrow">Deep dive • CRUD with pickle</div><h2>Create multiple records</h2><pre class="code">import pickle\nwith open("students.dat", "wb") as f:\n    while True:\n        rec = [int(input("Roll: ")), input("Name: "), float(input("Marks: "))]\n        pickle.dump(rec, f)\n        if input("More? ").lower() != 'y': break</pre><h2>Search until EOF</h2><pre class="code">found = False\nwith open("students.dat", "rb") as f:\n    try:\n        while True:\n            rec = pickle.load(f)\n            if rec[0] == target:\n                print(rec[1]); found = True; break\n    except EOFError:\n        pass\nif not found: print("Roll not found")</pre><h2>Update safely</h2><pre class="code">records = []\nwith open("students.dat", "rb") as f:\n    try:\n        while True: records.append(pickle.load(f))\n    except EOFError: pass\nfor rec in records:\n    if rec[0] == target: rec[2] = new_marks\nwith open("students.dat", "wb") as f:\n    for rec in records: pickle.dump(rec, f)</pre><div class="callout orange"><strong>Why this works</strong>Pickle stores objects one after another, so there is no built-in “edit row in place” operation. Read, modify in memory, then rewrite.</div></div>`,
csv:`<div class="deep-pack"><div class="eyebrow">Deep dive • CSV records</div><h2>Header-aware reading</h2><pre class="code">import csv\nwith open("users.csv", newline="") as f:\n    reader = csv.reader(f)\n    next(reader)\n    for row in reader:\n        if row[0] == target:\n            print(row[1])</pre><p><code>reader()</code> returns each row as a list. In this example, column 0 is user-id and column 1 is password.</p><h2>One row versus many rows</h2><pre class="code">writer.writerow(["u03", "abc789"])\nwriter.writerows([["u04", "p4"], ["u05", "p5"]])</pre><p>A row is an iterable. Do not pass a plain string to <code>writerow()</code> when you mean one cell—it will treat each character as a separate column.</p><div class="callout red"><strong>Classic error</strong><code>writer.writerow("Asha")</code> creates five cells. Use <code>writer.writerow(["Asha"])</code> for one cell.</div></div>`,
stack:`<div class="deep-pack"><div class="eyebrow">Deep dive • stack traces</div><h2>Trace a stack</h2><table class="table"><tr><th>Operation</th><th>Stack bottom → top</th><th>Output</th></tr><tr><td>push(10)</td><td>10</td><td>—</td></tr><tr><td>push(20)</td><td>10, 20</td><td>—</td></tr><tr><td>pop()</td><td>10</td><td>20</td></tr><tr><td>push(30)</td><td>10, 30</td><td>—</td></tr><tr><td>peek</td><td>10, 30</td><td>30</td></tr></table><h2>Menu-driven implementation</h2><pre class="code">stack = []\nwhile True:\n    choice = input("1 Push 2 Pop 3 Peek 4 Exit: ")\n    if choice == '1': stack.append(input("Item: "))\n    elif choice == '2': print(stack.pop() if stack else "Underflow")\n    elif choice == '3': print(stack[-1] if stack else "Empty")\n    else: break</pre><p>The “top” is the right end of the list. This makes push and pop efficient and keeps the implementation aligned with the abstract data structure.</p><div class="callout blue"><strong>Answer vocabulary</strong>Use push, pop, peek/top, overflow (capacity-limited stack) and underflow (pop from empty stack).</div></div>`,
evolution:`<div class="deep-pack"><div class="eyebrow">Deep dive • history in one answer</div><h2>Why packet switching mattered</h2><p>ARPANET was designed to connect research computers and survive the loss of individual links. Instead of reserving one complete path, data was divided into packets. That idea made networks share links efficiently and recover from failures.</p><p>NSFNET expanded high-speed academic networking. Commercial networks and common TCP/IP protocols then helped form the global Internet. The Web arrived as an application layer service on top of that infrastructure.</p><div class="callout green"><strong>Three-line board answer</strong>ARPANET was an early packet-switched network; NSFNET expanded academic backbone connectivity; the Internet evolved as a global interconnection using common protocols.</div></div>`,
communication:`<div class="deep-pack"><div class="eyebrow">Deep dive • communication mechanics</div><h2>Bandwidth versus data transfer rate</h2><p>Bandwidth is the theoretical capacity of the medium; data transfer rate is the actual amount transferred per second. A busy network, protocol overhead and signal quality can make actual rate lower than bandwidth.</p><h2>Switching comparison example</h2><p>In a traditional telephone call, circuit switching reserves a path even while nobody speaks. In packet switching, a video call is split into packets; the network can share links with other users, but packets may arrive late or out of order.</p><h2>IP address</h2><p>An IP address is a logical network identifier. Routers inspect destination IP addresses to choose the next hop. It is different from an RJ45 connector or a network card, which are physical/interface components.</p><div class="callout orange"><strong>Do not mix</strong>Bandwidth is capacity, not storage size; IP address is logical identification, not the physical address of a building.</div></div>`,
media:`<div class="deep-pack"><div class="eyebrow">Deep dive • transmission comparisons</div><h2>How to choose a medium</h2><table class="table"><tr><th>Requirement</th><th>Best fit</th><th>Reason</th></tr><tr><td>Low-cost office cabling</td><td>Twisted pair</td><td>Easy installation and adequate LAN speed</td></tr><tr><td>Long, high-speed backbone</td><td>Fiber optic</td><td>High bandwidth, low loss, EMI resistance</td></tr><tr><td>Mobility across a room</td><td>Radio</td><td>No physical cable required</td></tr><tr><td>Remote line-of-sight link</td><td>Microwave</td><td>Directional, high-frequency transmission</td></tr></table><p>Electromagnetic interference means unwanted electrical noise. Fiber carries pulses of light, so it is not affected in the same way as copper cable. Infrared is short range and generally line-of-sight.</p></div>`,
devices:`<div class="deep-pack"><div class="eyebrow">Deep dive • device scenarios</div><h2>One school network, many devices</h2><p>A Wi-Fi card lets a laptop join the wireless LAN. A switch connects wired computers inside the lab. A router connects the school LAN to the ISP/Internet. A modem converts the signal format needed for the ISP connection. A repeater extends a weak signal; a gateway can translate between unlike environments.</p><h2>Hub versus switch</h2><p>If a hub receives a frame for computer A, it broadcasts it out all ports. A switch learns source MAC addresses and forwards the frame only toward A’s port when possible. Thus switches reduce unnecessary traffic and collisions.</p><div class="callout blue"><strong>Hardware identification</strong>RJ45 is a connector, not a device. Ethernet card/Wi-Fi card is an interface, not a routing device.</div></div>`,
topology:`<div class="deep-pack"><div class="eyebrow">Deep dive • type versus shape</div><h2>Network type scenario quiz</h2><p>Smartwatch connected to a phone: PAN. Computers in one school building: LAN. A city-wide cable provider network: MAN. Branch offices across countries: WAN. The classification is based mainly on geographic scope.</p><h2>Topology failure reasoning</h2><ul><li>Bus: backbone break can divide or stop the network.</li><li>Star: one node cable failure affects one node; central switch failure affects many.</li><li>Tree: a structured hierarchy is scalable, but an upper branch failure affects its descendants.</li></ul><div class="callout green"><strong>Exam technique</strong>When comparing topologies, mention structure, installation/expansion, fault effect and a limitation—not just a diagram name.</div></div>`,
protocols:`<div class="deep-pack"><div class="eyebrow">Deep dive • protocol use-cases</div><h2>Follow one email and one web request</h2><p>When you send mail, your client submits it using SMTP. The receiver’s client may retrieve stored mail using POP3. When you open a secure website, the browser uses HTTPS; the web server returns resources. FTP is used for file transfer, while TCP/IP provides the broader addressing and transport foundation.</p><table class="table"><tr><th>Question wording</th><th>Likely answer</th></tr><tr><td>Send email</td><td>SMTP</td></tr><tr><td>Receive/download email</td><td>POP3</td></tr><tr><td>Transfer files</td><td>FTP</td></tr><tr><td>Secure web browsing</td><td>HTTPS</td></tr><tr><td>Voice over Internet</td><td>VoIP</td></tr></table><div class="callout orange"><strong>Full forms matter</strong>Write Simple Mail Transfer Protocol, File Transfer Protocol and Voice over Internet Protocol at least once in your revision notes.</div></div>`,
web:`<div class="deep-pack"><div class="eyebrow">Deep dive • request lifecycle</div><h2>What happens when you open a URL?</h2><ol><li>Browser parses the URL and resolves the domain to an IP address.</li><li>It sends a request using HTTP/HTTPS.</li><li>The web server or hosting platform receives the request.</li><li>The server returns HTML and possibly CSS, JavaScript and media.</li><li>The browser interprets HTML and renders the page.</li></ol><h2>HTML versus XML</h2><p>HTML uses predefined tags to describe document structure and presentation semantics. XML lets the author define meaningful tags for transporting structured data. XML is not “a newer HTML”; their purposes differ.</p><pre class="code">&lt;student&gt;\n  &lt;roll&gt;12&lt;/roll&gt;\n  &lt;marks&gt;91&lt;/marks&gt;\n&lt;/student&gt;</pre><div class="callout blue"><strong>Terminology trap</strong>A domain name identifies a site; a URL identifies a specific resource/location, often including a path.</div></div>`,
db:`<div class="deep-pack"><div class="eyebrow">Deep dive • why structure matters</div><h2>File-based approach versus DBMS</h2><p>Separate files can duplicate the same student or customer data, making updates inconsistent. A DBMS centralizes related data, supports constraints and lets many users query it. The database does not remove the need for good design: poor tables still create duplication and errors.</p><h2>Integrity examples</h2><p><code>NOT NULL</code> stops a required name from being absent. <code>UNIQUE</code> prevents duplicate email IDs. A primary key gives each row a stable identity. A foreign key prevents references to a class that does not exist when referential integrity is enforced.</p><div class="callout green"><strong>Board answer structure</strong>Define database, state two needs (organized storage, easy retrieval/updates, reduced redundancy, controlled sharing), then give one school/business example.</div></div>`,
keys:`<div class="deep-pack"><div class="eyebrow">Deep dive • key identification</div><h2>Candidate key example</h2><p>In <code>Student(roll, email, name, class)</code>, both roll and email might uniquely identify a student. Therefore roll and email are candidate keys. If roll is selected as primary, email becomes an alternate key. If <code>class_id</code> points to <code>Class(class_id)</code>, it is a foreign key.</p><h2>Minimality</h2><p>A candidate key must be minimal. If <code>(roll, name)</code> is unique but roll alone is already unique, the pair is not minimal and is not a candidate key.</p><div class="callout orange"><strong>NULL rule</strong>A primary key cannot be NULL. A foreign key may be NULL in some designs when the relationship is optional, but it must match a referenced key when present.</div></div>`,
sql:`<div class="deep-pack"><div class="eyebrow">Deep dive • DDL + DML worked sequence</div><h2>Build, fill, read and change</h2><pre class="code">CREATE DATABASE School;\nUSE School;\nCREATE TABLE Student(roll INT PRIMARY KEY, name VARCHAR(30) NOT NULL, marks FLOAT);\nINSERT INTO Student VALUES (1, 'Asha', 91);\nINSERT INTO Student(roll, name, marks) VALUES (2, 'Ravi', 76);\nUPDATE Student SET marks = 80 WHERE roll = 2;\nDELETE FROM Student WHERE roll = 2;\nDROP TABLE Student;</pre><p><code>SHOW DATABASES</code>, <code>SHOW TABLES</code> and <code>DESCRIBE Student</code> inspect the database and table. <code>ALTER TABLE</code> changes structure: add/drop an attribute or add/drop a primary key according to the SQL implementation taught at school.</p><div class="callout red"><strong>WHERE checkpoint</strong>Before UPDATE/DELETE, run the same condition as SELECT to confirm the target rows.</div></div>`,
queries:`<div class="deep-pack"><div class="eyebrow">Deep dive • translate English to SQL</div><h2>Question-to-query examples</h2><table class="table"><tr><th>English requirement</th><th>SQL fragment</th></tr><tr><td>Marks from 60 to 80 inclusive</td><td><code>WHERE marks BETWEEN 60 AND 80</code></td></tr><tr><td>Names beginning with A</td><td><code>WHERE name LIKE 'A%'</code></td></tr><tr><td>Classes 11 or 12</td><td><code>WHERE class IN (11, 12)</code></td></tr><tr><td>Unique cities</td><td><code>SELECT DISTINCT city</code></td></tr><tr><td>Highest marks first</td><td><code>ORDER BY marks DESC</code></td></tr></table><h2>LIKE wildcards</h2><p><code>%</code> matches any sequence of characters; <code>_</code> matches exactly one character. So <code>'%gmail.com'</code> ends with gmail.com and <code>'A__'</code> is exactly three characters starting with A.</p><div class="callout blue"><strong>NULL calculation</strong><code>AVG(marks)</code> generally ignores NULL marks, but a row with a missing mark is not the same as a zero mark. State this distinction when explaining results.</div></div>`,
aggregate:`<div class="deep-pack"><div class="eyebrow">Deep dive • grouping logic</div><h2>Order of thought</h2><p>FROM chooses the table, WHERE removes individual rows, GROUP BY forms groups, aggregate functions calculate within each group, HAVING removes groups, and ORDER BY sorts the final result.</p><pre class="code">SELECT city, COUNT(*) AS n, MAX(marks) AS top\nFROM Student\nWHERE marks IS NOT NULL\nGROUP BY city\nHAVING COUNT(*) &gt;= 2\nORDER BY top DESC;</pre><p>This returns one row per city, but only cities with at least two students. A selected column that is not aggregated normally needs to appear in GROUP BY.</p><div class="callout orange"><strong>COUNT distinction</strong><code>COUNT(*)</code> counts rows; <code>COUNT(marks)</code> counts non-NULL marks. If a student has NULL marks, the two counts differ.</div></div>`,
joins:`<div class="deep-pack"><div class="eyebrow">Deep dive • join reasoning</div><h2>Two-table example</h2><pre class="code">Student(roll, name, course_id)\nCourse(course_id, course_name)\n\nSELECT s.roll, s.name, c.course_name\nFROM Student s, Course c\nWHERE s.course_id = c.course_id;</pre><p>This older comma syntax expresses an equi-join. The explicit JOIN form is easier to read and makes the matching condition visible. A Cartesian product would omit the equality condition and pair every student with every course.</p><h2>Natural join caution</h2><p>A natural join uses every same-named column automatically. It can be convenient in textbook examples, but if unrelated columns later share a name it may join on more conditions than intended. In practical work, an explicit <code>ON</code> clause is clearer.</p></div>`,
pysq:`<div class="deep-pack"><div class="eyebrow">Deep dive • application patterns</div><h2>Insert with a placeholder</h2><pre class="code">sql = "INSERT INTO Student(roll,name,marks) VALUES(%s,%s,%s)"\nvalues = (12, "Asha", 91)\ncur.execute(sql, values)\ncon.commit()</pre><h2>Display and rowcount</h2><pre class="code">cur.execute("SELECT roll, name FROM Student")\nrow = cur.fetchone()       # one tuple or None\nrows = cur.fetchall()       # remaining/all tuples\nprint(cur.rowcount)         # affected rows, connector dependent</pre><h2>Application checklist</h2><ul><li>Validate user input before sending it to SQL.</li><li>Use the required connector module and correct credentials.</li><li>Use a cursor for every execute call.</li><li>Commit changes; SELECT usually does not need commit.</li><li>Close cursor and connection in cleanup code.</li></ul><div class="callout red"><strong>Security note</strong>Never concatenate raw user input into SQL in a real application. Placeholders avoid quoting errors and reduce injection risk.</div></div>`,
practical:`<div class="deep-pack"><div class="eyebrow">Deep dive • scoring the practical</div><h2>How to earn every practical component</h2><table class="table"><tr><th>Component</th><th>What examiner can see</th><th>Your preparation</th></tr><tr><td>Python lab</td><td>Logic, documentation, code quality</td><td>Algorithm, meaningful names, comments, test cases</td></tr><tr><td>SQL lab</td><td>Correct query and output</td><td>Practise filters, aggregates, joins and NULL</td></tr><tr><td>Report file</td><td>Completeness and presentation</td><td>15 Python + 5 SQL sets + 4 connectivity programs</td></tr><tr><td>Project</td><td>Working, useful, original solution</td><td>Problem statement, design, testing and attribution</td></tr><tr><td>Viva</td><td>Understanding, not memorisation</td><td>Explain inputs, outputs, choices and edge cases</td></tr></table><h2>Project documentation template</h2><ol><li>Problem and intended users</li><li>Requirements and assumptions</li><li>Data model/file format</li><li>Algorithms and screenshots</li><li>Testing table with expected/actual output</li><li>Limitations and future scope</li><li>Credits and originality statement</li></ol><div class="callout green"><strong>100/100 habit</strong>Run every program with normal input, empty input, boundary values and invalid input. Save those outputs in the report.</div></div>`

function renderNav(active){const n=document.getElementById('nav');n.innerHTML=navGroups.map(([g,items])=>`<div class="nav-label">${g}</div>${items.map(([id,label])=>`<button class="${id===active?'active':''}" onclick="go('${id}')">${label}<span class="num">${id==='home'?'⌂':'›'}</span></button>`).join('')}`).join('')}

function render(){let id=location.hash.slice(1)||'home'; if(!pages[id] && !['exam','question-bank','library','most-asked','coding','tests','cheatsheet','roadmap','practical-lab'].includes(id))id='home'; const p=pages[id]||{group:'Exam toolkit',title:id,sub:''};renderNav(id);document.getElementById('crumb').textContent=`${p.group} / ${p.title}`; const el=document.getElementById('app'); if(id==='exam') el.innerHTML=examPage(); else if(id==='question-bank') el.innerHTML=questionBankPage(); else if(id==='library') el.innerHTML=libraryPage(); else if(id==='most-asked') el.innerHTML=mostAskedPage(); else if(id==='coding') el.innerHTML=codingPage(); else if(id==='tests') el.innerHTML=testsPage(); else if(id==='cheatsheet') el.innerHTML=cheatsheetPage(); else if(id==='roadmap') el.innerHTML=roadmapPage(); else if(id==='practical-lab') el.innerHTML=practicalLabPage(); else if(p.kind==='home') el.innerHTML=home(); else el.innerHTML=`<div class="page-head"><div class="back" onclick="go('home')">← Back to overview</div><h1>${p.title}</h1><p>${p.sub}</p></div><article class="lesson">${p.body}${deepDive[id]||''}</article>${quiz(id)}`;addExampleOutputs();restoreChecks();if(id==='exam')startExam();if(id==='library')setTimeout(filterLibrary,0);if(id==='coding')setTimeout(renderCoding,0);if(id==='tests'){}if(id==='practical-lab')showLab('text-file');window.scrollTo({top:0,behavior:'smooth'})}
function home(){const cards=Object.entries(pages).filter(([id])=>id!=='home').map(([id,p])=>`<div class="card unit-card ${p.group.includes('Unit 2')?'green':p.group.includes('Unit 3')?'purple':p.group==='Practical'?'orange':''}" onclick="go('${id}')"><div class="card-icon">${p.group.includes('Unit 2')?'⌁':p.group.includes('Unit 3')?'▦':p.group==='Practical'?'✓':'⌘'}</div><div class="tag">${p.group}</div><h3>${p.title}</h3><p>${p.sub}</p><div class="arrow">Open lesson →</div></div>`).join('');return `<section class="hero"><div class="eyebrow">CBSE • Subject Code 083 • 2026–27</div><h1>Learn the syllabus.<br>Own the paper.</h1><p>${pages.home.sub}</p><div class="actions"><button class="btn primary" onclick="go('functions')">Start with Unit 1</button><button class="btn ghost" onclick="go('practical')">Plan practical marks</button></div></section><section class="focus-panel"><div><div class="eyebrow">Exam cockpit</div><h2>Turn study time into marks.</h2><p>Use the mock exam, topic question bank, revision roadmap and practical lab to close gaps—not just read notes.</p></div><div class="actions"><button class="btn primary" onclick="go('exam')">Take a mock exam</button><button class="btn ghost" onclick="go('roadmap')">Open roadmap</button></div><div class="mini-progress"><span id="homeProgress">0%</span> checklist complete</div></section><div class="stats"><div class="stat"><b>70</b><span>Theory marks</span></div><div class="stat"><b>30</b><span>Practical marks</span></div><div class="stat"><b>40</b><span>Unit 1 weight</span></div><div class="stat"><b>23</b><span>Focused lessons</span></div></div><div class="section-title"><div><h2>Pick a lesson</h2><p>Short pages. Deep explanations. Exam-ready patterns.</p></div></div><div class="grid">${cards}</div><div class="study-loop"><div class="loop-card"><div class="loop-num">1</div><b>Learn the idea</b><p>Read the deep dive and follow the worked example.</p></div><div class="loop-card"><div class="loop-num">2</div><b>Write it yourself</b><p>Use Coding Practice without looking at the model answer.</p></div><div class="loop-card"><div class="loop-num">3</div><b>Prove it under time</b><p>Take a random test, study weaknesses, and repeat.</p></div></div><p class="footer-note">Built from the provided CBSE Class XII Computer Science 2026–27 syllabus. Use this as a learning companion alongside your textbook and teacher guidance.</p>`}

let examState={i:0,score:0,answered:false};
function startExam(){examState={i:0,score:0,answered:false};renderExam()}
function renderExam(){const q=examQs[examState.i]; if(!q){document.getElementById('examBox').innerHTML=`<div class="result-card"><div class="result-score">${examState.score}/${examQs.length}</div><h2>${examState.score>=10?'Strong board readiness.':'Good first attempt—use the topic breakdown below.'}</h2><p>Review every wrong answer before repeating. Your target is 10/12 twice in a row.</p><button class="btn primary" onclick="startExam()">Try again</button><button class="btn ghost" onclick="go('question-bank')">Target weak topics</button></div>`;return}document.getElementById('examStatus').textContent=`Question ${examState.i+1} of ${examQs.length} • ${q.u}`;document.getElementById('examBar').style.width=((examState.i)/examQs.length*100)+'%';document.getElementById('examBox').innerHTML=`<div class="exam-q"><span class="tag">${q.u}</span><h2>${q.q}</h2>${q.o.map(o=>`<button class="option light" onclick="examAnswer(this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}<p class="quiz-result"></p></div>`}
function examAnswer(btn,v){if(examState.answered)return;examState.answered=true;const q=examQs[examState.i];[...btn.parentElement.querySelectorAll('.option')].forEach(b=>{b.disabled=true;if(b.textContent.trim()===q.a)b.classList.add('correct')});if(v===q.a){examState.score++;btn.classList.add('correct');btn.parentElement.querySelector('.quiz-result').textContent='Correct.'}else{btn.classList.add('wrong');btn.parentElement.querySelector('.quiz-result').textContent=`Answer: ${q.a}`}setTimeout(()=>{examState.i++;examState.answered=false;renderExam()},850)}
function questionBankPage(){return shell('Question bank','Use these as active recall prompts. Hide the answer mentally, write a two-mark response, then open the lesson link.',`<div class="bank-filter"><button class="btn primary" onclick="filterBank('all')">All</button><button class="btn ghost" onclick="filterBank('Programming')">Programming</button><button class="btn ghost" onclick="filterBank('Networks')">Networks</button><button class="btn ghost" onclick="filterBank('Database')">Database</button></div><div id="bankList">${bankCards('all')}</div>`)}
function bankCards(filter){return examQs.filter(x=>filter==='all'||x.u===filter).map((x,i)=>`<details class="bank-card"><summary><span class="tag">${x.u}</span> ${x.q}</summary><div><b>Answer:</b> ${x.a}<br><span class="muted">Exam habit: write the definition/logic first, then the example or justification.</span></div></details>`).join('')}
function filterBank(f){document.getElementById('bankList').innerHTML=bankCards(f)}

let testState={questions:[],i:0,score:0,wrong:[]};
function libraryPage(){return shell('Massive question library',`${libraryQuestions.length} active-recall questions across the complete syllabus. Filter by topic, reveal answers, and turn weak areas into a test.`,`<div class="library-toolbar"><input id="libSearch" class="search lib-search" placeholder="Search question text…" oninput="filterLibrary()"><select id="libTopic" onchange="filterLibrary()"><option value="all">All topics</option>${[...new Set(libraryQuestions.map(x=>x.topic))].map(t=>`<option>${t}</option>`).join('')}</select><button class="btn primary" onclick="go('tests')">Test me on 10 random questions</button></div><div class="library-count" id="libraryCount"></div><div id="libraryList"></div>`)+`<script>setTimeout(()=>filterLibrary(),0)<\/script>`}
function filterLibrary(){const searchEl=document.getElementById('libSearch');const topicEl=document.getElementById('libTopic');const text=(searchEl?searchEl.value:'').toLowerCase();const topic=topicEl?topicEl.value:'all';const rows=libraryQuestions.map((x,i)=>({...x,i})).filter(x=>(topic==='all'||x.topic===topic)&&x.question.toLowerCase().includes(text));const list=document.getElementById('libraryList');if(!list)return;document.getElementById('libraryCount').textContent=`Showing ${rows.length} of ${libraryQuestions.length} questions`;list.innerHTML=rows.map(x=>`<details class="bank-card library-card"><summary><span class="tag">${x.topic}</span> Q${x.i+1}. ${x.question}</summary><div><b>Answer:</b> ${x.answer}<br><span class="muted">Why: ${x.why}</span><br><button class="btn ghost" onclick="event.stopPropagation();go('tests')">Practise this topic</button></div></details>`).join('')||'<div class="callout orange">No questions match. Try a broader search.</div>'}

const mostAskedTopics=['Functions','Text files','Binary/CSV','Stack','Networks','Devices','Protocols','Database','SQL','Aggregates','Joins','Python-SQL'];
function mostAskedPage(){return shell('Most asked from CBSE papers','A paper-pattern library built from official CBSE sample/additional-practice papers and recurring question formats—not a prediction of the next paper.',`<div class="callout orange"><strong>How this was selected</strong>These are recurring patterns observed across official CBSE sample/practice material: output tracing, file modes, file programs, network comparisons, SQL command writing, table-based queries, joins, aggregates and Python–SQL methods. CBSE does not publish an official frequency ranking, so treat this as high-priority practice rather than a guarantee.</div><div class="source-strip"><b>Paper sources consulted:</b> <a href="https://cbseacademic.nic.in/web_material/SQP/ClassXII_2022_23/ComputerScience-SQP.pdf" target="_blank">CBSE SQP 2022–23</a> · <a href="https://cbseacademic.nic.in/web_material/SQP/ClassXII_2023_24/CS_PQ.pdf" target="_blank">CBSE Additional Practice 2023–24</a> · <a href="https://cbseacademic.nic.in/web_material/SQP/ClassXII_2025_26/ComputerScience-SQP.pdf" target="_blank">CBSE SQP 2025–26</a> · <a href="https://cbseacademic.nic.in/web_material/SQP/ClassXII_2025_26/ComputerScience-MS.pdf" target="_blank">CBSE Marking Scheme 2025–26</a></div><div class="actions"><button class="btn primary" onclick="go('tests')">Test me on 10</button><button class="btn ghost" onclick="go('cheatsheet')">Open cheat sheet</button></div><div class="bank-list">${paperPatterns.map((x,i)=>`<details class="bank-card"><summary><span class="tag">Priority ${i+1} • ${x.t}</span> ${x.q}</summary><div><b>Expected answer:</b> ${x.a}<br><span class="muted"><b>Why it matters:</b> ${x.w}<br><b>Pattern source:</b> ${x.s}</span></div></details>`).join('')}</div>`)}


function codingPage(){return shell('Coding & SQL practice','No MCQs here. Run/check outputs, spot errors, or write programs before revealing the solution.',`<div class="callout blue"><strong>How to use this page</strong>For output questions, type the output and the site compares it with the expected result. For programs and SQL, write your solution first, then run it in your school Python/SQL environment and use the model answer as a marking guide.</div><div class="coding-toolbar"><select id="codingType" onchange="renderCoding()"><option value="all">All coding questions</option><option>Output tracing</option><option>Spot the error</option><option>Write a program</option><option>SQL query</option></select><select id="codingTopic" onchange="renderCoding()"><option value="all">All topics</option>${[...new Set(codingQuestions.map(x=>x.topic))].map(t=>`<option>${t}</option>`).join('')}</select><button class="btn primary" onclick="randomCoding()">Give me 5 random</button></div><div id="codingCount"></div><div id="codingList"></div>`)}
function codingCard(x,i){const qid=codingQuestions.indexOf(x);return `<details class="coding-card"><summary><span class="tag">${x.type} • ${x.topic}</span> Q${i+1}. ${x.prompt}</summary><div>${x.code?`<pre class="code">${x.code}</pre>`:''}${x.type==='Output tracing'?`<div class="answer-box"><textarea id="ans-${qid}" placeholder="Type the exact output here…"></textarea><button class="btn primary" onclick="checkOutput(${qid})">Check output</button><span id="feedback-${qid}" class="feedback"></span></div>`:''}${x.type==='Spot the error'?`<div class="answer-box"><textarea id="ans-${qid}" placeholder="Explain the error and write the correction…"></textarea><button class="btn primary" onclick="checkClose(${qid})">Check response</button><span id="feedback-${qid}" class="feedback"></span></div>`:''}<details class="solution"><summary>Reveal model answer</summary><pre class="code">${x.answer}</pre><div class="callout blue"><strong>Why / marking idea</strong>${x.explain}</div></details></div></details>`}
function renderCoding(list){const type=(document.getElementById('codingType')?document.getElementById('codingType').value:'all');const topic=(document.getElementById('codingTopic')?document.getElementById('codingTopic').value:'all');const rows=(list||codingQuestions).filter(x=>(type==='all'||x.type===type)&&(topic==='all'||x.topic===topic));document.getElementById('codingCount').textContent=`${rows.length} non-MCQ questions`;document.getElementById('codingList').innerHTML=rows.map((x,i)=>codingCard(x,i)).join('')}
function normalizeAnswer(v){return v.toLowerCase().replace(/\s+/g,' ').replace(/[“”]/g,'"').trim()}
function checkOutput(id){const q=codingQuestions[id],input=document.getElementById('ans-'+id),out=document.getElementById('feedback-'+id);const given=normalizeAnswer(input.value),expected=normalizeAnswer(q.answer);if(given===expected){out.textContent='✓ Correct output. '+q.explain;out.className='feedback good'}else if(given&&expected.includes(given)){out.textContent='Close, but check line breaks/spaces. Expected: '+q.answer;out.className='feedback close'}else{out.textContent='Not correct yet. Expected: '+q.answer+' — read the explanation, then retry.';out.className='feedback bad'} }
function checkClose(id){const q=codingQuestions[id],input=document.getElementById('ans-'+id),out=document.getElementById('feedback-'+id);const words=q.answer.toLowerCase().split(/\W+/).filter(w=>w.length>3),given=input.value.toLowerCase();const hits=words.filter(w=>given.indexOf(w)>=0).length;if(hits>=Math.min(3,words.length)){out.textContent='✓ Your explanation contains the key idea. Compare it with the model answer for exact syntax.';out.className='feedback good'}else{out.textContent='Needs another pass. Look for the exact error, correction and reason in the model answer.';out.className='feedback bad'}}
function randomCoding(){const rows=codingQuestions.slice().sort(()=>Math.random()-.5).slice(0,5);renderCoding(rows)}

function testsPage(){return shell('Random test generator','Select the size and topic focus. Every test is marked immediately and ends with a topic-wise weakness report.',`<div class="test-controls"><label>Questions <select id="testSize"><option>10</option><option>20</option><option>30</option></select></label><label>Focus <select id="testFocus"><option value="all">Full syllabus</option>${[...new Set(libraryQuestions.map(x=>x.topic))].map(t=>`<option>${t}</option>`).join('')}</select></label><button class="btn primary" onclick="startLibraryTest()">Start random test</button></div><div id="testArea"><div class="callout blue"><strong>How this works</strong>Choose a size and focus. Questions are shuffled, answers are hidden until you choose, and wrong answers are grouped by topic at the end.</div></div>`)}
function startLibraryTest(){const n=Number(document.getElementById('testSize').value);const f=document.getElementById('testFocus').value;let pool=libraryQuestions.filter(x=>f==='all'||x.topic===f);pool.sort(()=>Math.random()-.5);testState={questions:pool.slice(0,Math.min(n,pool.length)),i:0,score:0,wrong:[]};renderLibraryTest()}
function renderLibraryTest(){const area=document.getElementById('testArea');if(!testState.questions.length){area.innerHTML='<div class="callout orange">Start a test above.</div>';return}if(testState.i>=testState.questions.length){const by={};testState.wrong.forEach(x=>by[x.topic]=(by[x.topic]||0)+1);const report=Object.entries(by).sort((a,b)=>b[1]-a[1]);area.innerHTML=`<div class="result-card"><div class="result-score">${testState.score}/${testState.questions.length}</div><h2>${testState.score===testState.questions.length?'Perfect test.':'Test complete.'}</h2><p>${testState.score===testState.questions.length?'Keep the streak going with a harder focus test.':'Review the weak topics below, then retake a focused test.'}</p>${report.length?`<div class="weak-report"><h3>Topic-wise weakness analysis</h3>${report.map(([t,n])=>`<div class="weak-row"><span>${t}</span><b>${n} wrong</b><button class="btn ghost" onclick="document.getElementById('testFocus').value='${t}';go('tests')">Practise</button></div>`).join('')}</div>`:'<div class="callout green">No weak topics recorded.</div>'}<button class="btn primary" onclick="startLibraryTest()">New random test</button></div>`;return}const q=testState.questions[testState.i];area.innerHTML=`<div class="exam-toolbar"><span>Question ${testState.i+1} of ${testState.questions.length} • ${q.topic}</span><span>${testState.score} correct so far</span></div><div class="progress"><i style="width:${testState.i/testState.questions.length*100}%"></i></div><div class="exam-q"><span class="tag">${q.topic}</span><h2>${q.question}</h2>${q.options.sort(()=>Math.random()-.5).map(o=>`<button class="option light" onclick="answerLibrary(this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}<p class="quiz-result"></p></div>`}
function answerLibrary(btn,v){const q=testState.questions[testState.i];[...btn.parentElement.querySelectorAll('.option')].forEach(b=>{b.disabled=true;if(b.textContent.trim()===q.answer)b.classList.add('correct')});if(v===q.answer){testState.score++;btn.classList.add('correct');btn.parentElement.querySelector('.quiz-result').textContent='Correct — '+q.why}else{btn.classList.add('wrong');testState.wrong.push(q);btn.parentElement.querySelector('.quiz-result').textContent='Answer: '+q.answer+' — '+q.why}setTimeout(()=>{testState.i++;renderLibraryTest()},800)}
function cheatsheetPage(){return shell('Ultimate cheat sheet','A last-week reference: definitions, syntax, modes, protocol uses, SQL clauses and connectivity order.',`<div class="sheet-grid"><section class="sheet-card"><h2>Python essentials</h2><table class="table"><tr><th>Need</th><th>Remember</th></tr><tr><td>Function</td><td><code>def name(parameters):</code>; use <code>return</code> to send value</td></tr><tr><td>File read</td><td><code>with open("f.txt","r") as f:</code></td></tr><tr><td>Text methods</td><td><code>read()</code> all, <code>readline()</code> one, <code>readlines()</code> list</td></tr><tr><td>Binary</td><td><code>pickle.dump(obj,f)</code>, <code>pickle.load(f)</code>; catch EOFError</td></tr><tr><td>CSV</td><td><code>writerow</code> one row, <code>writerows</code> many, <code>reader</code> rows</td></tr><tr><td>Stack</td><td>Push <code>append</code>, pop <code>pop</code>, peek <code>[-1]</code>; LIFO</td></tr></table></section><section class="sheet-card"><h2>File modes</h2><table class="table"><tr><th>Mode</th><th>Meaning</th></tr><tr><td>r / rb</td><td>Read existing</td></tr><tr><td>w / wb</td><td>Write; erase old content</td></tr><tr><td>a / ab</td><td>Append at end</td></tr><tr><td>r+ / rb+</td><td>Read/write existing</td></tr><tr><td>w+ / wb+</td><td>Truncate, then read/write</td></tr><tr><td>a+ / ab+</td><td>Append and read</td></tr></table></section><section class="sheet-card"><h2>Networks at a glance</h2><p><b>PAN</b> personal • <b>LAN</b> building • <b>MAN</b> city • <b>WAN</b> wide area</p><p><b>Hub</b> broadcasts • <b>Switch</b> forwards in LAN • <b>Router</b> connects networks • <b>Repeater</b> regenerates • <b>Modem</b> modulates/demodulates • <b>Gateway</b> translates environments</p><p><b>SMTP</b> send mail • <b>POP3</b> retrieve mail • <b>FTP</b> files • <b>HTTP/HTTPS</b> web • <b>VoIP</b> voice • <b>TCP/IP</b> Internet suite</p></section><section class="sheet-card"><h2>SQL command map</h2><pre class="code">CREATE DATABASE School;\nUSE School;\nCREATE TABLE T(...);\nALTER TABLE T ADD column type;\nINSERT INTO T VALUES (...);\nSELECT ... FROM T WHERE ...;\nUPDATE T SET col=value WHERE ...;\nDELETE FROM T WHERE ...;\nDROP TABLE T;</pre><p><b>WHERE</b> rows • <b>GROUP BY</b> groups • <b>HAVING</b> groups after aggregate • <b>ORDER BY</b> sort • <b>DISTINCT</b> remove duplicate result rows</p></section><section class="sheet-card"><h2>SQL functions & NULL</h2><p><code>MAX, MIN, AVG, SUM, COUNT</code>. <code>COUNT(*)</code> counts rows; <code>COUNT(column)</code> ignores NULL. Test missing values using <code>IS NULL</code>, never <code>= NULL</code>.</p><pre class="code">SELECT class, AVG(marks) AS avg_marks\nFROM Student\nWHERE marks IS NOT NULL\nGROUP BY class\nHAVING AVG(marks) >= 75\nORDER BY avg_marks DESC;</pre></section><section class="sheet-card"><h2>Python–SQL order</h2><ol><li><code>connect()</code></li><li><code>cursor()</code></li><li><code>execute(query, values)</code></li><li><code>commit()</code> after changes</li><li><code>fetchone()</code>/<code>fetchall()</code></li><li><code>rowcount</code></li><li>close resources</li></ol><pre class="code">cur.execute("... WHERE roll=%s", (roll,))\ncon.commit()</pre></section></div><div class="callout orange"><strong>Last-minute rule</strong>Do not only read this page. Cover each row and reproduce the syntax from memory, then verify it.</div>`)}
function roadmapPage(){return shell('Revision roadmap','A practical 4-week loop for theory + practical marks. Tick boxes; progress is saved on this device.',`<div class="roadmap-grid">${[['Week 1','Programming core',['XI revision','Functions','Exception handling','Text files']],['Week 2','File handling + stack',['Binary files','CSV files','Stacks','Suggested Python programs']],['Week 3','Networks + SQL',['Network devices/protocols','Relational model + keys','DDL/DML + filters','Aggregates + joins']],['Week 4','Exam mode',['Python–SQL connectivity','Complete 2 mock exams','Finish report/project/viva','Final formula sheet']]].map((w,wi)=>`<div class="road-card"><span class="tag">${w[0]}</span><h2>${w[1]}</h2>${w[2].map((x,xi)=>`<label class="check"><input type="checkbox" data-check="road-${wi}-${xi}"> ${x}</label>`).join('')}</div>`).join('')}</div><div class="callout orange"><strong>Spaced repetition rule</strong>Review a topic the same day, 2 days later, 7 days later and once in exam week. Do not wait until you “finish the syllabus” to practise.</div>`)}
function practicalLabPage(){return shell('Practical lab simulator','Four high-frequency practical families. For each one, write the program yourself before comparing with the starter pattern.',`<div class="lab-tabs">${Object.entries(practiceSets).map(([id,x],i)=>`<button class="btn ${i?'ghost':'primary'}" onclick="showLab('${id}')">${x.title.split(' ')[0]}</button>`).join('')}</div><div id="labBox"></div>`)}
function showLab(id){const x=practiceSets[id];document.getElementById('labBox').innerHTML=`<h2>${x.title}</h2><ol>${x.steps.map(s=>`<li>${s}</li>`).join('')}</ol><details class="solution"><summary>Reveal starter pattern</summary><pre class="code">${x.starter}</pre></details><div class="callout green"><strong>Self-check rubric</strong>${x.rubric}</div>`}
function storageGet(k){try{return localStorage.getItem(k)}catch(e){return null}}function storageSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}function restoreChecks(){document.querySelectorAll('input[type=checkbox][data-check]').forEach(x=>{x.checked=storageGet(x.dataset.check)==='1';x.onchange=()=>{storageSet(x.dataset.check,x.checked?'1':'0');updateProgress()}});updateProgress()}
function updateProgress(){const all=[...document.querySelectorAll('input[type=checkbox][data-check]')];const done=all.filter(x=>x.checked).length;if(document.getElementById('homeProgress'))document.getElementById('homeProgress').textContent=(all.length?Math.round(done/all.length*100):0)+'%';}
function quiz(id){const qs={functions:['Which statement ends a function and sends a value back?','return'],text:['Which mode adds data without deleting existing content?','a'],stack:['A stack follows which rule?','LIFO'],sql:['Which clause filters groups after GROUP BY?','HAVING'],pysq:['Which call permanently saves INSERT/UPDATE/DELETE changes?','commit()'],protocols:['Which protocol is used to send email?','SMTP']} ;if(!qs[id])return '';const [q,a]=qs[id];const opts=[a,'finally','ORDER BY','readlines()'].sort(()=>Math.random()-.5);return `<section class="quiz"><h3>Quick check</h3><p>${q}</p>${opts.map(o=>`<button class="option" onclick="answer(this,'${o.replace(/'/g,"\\'")}','${a.replace(/'/g,"\\'")}')">${o}</button>`).join('')}<p class="quiz-result" aria-live="polite"></p></section>`}
function answer(btn,value,correct){const box=btn.parentElement;[...box.querySelectorAll('.option')].forEach(b=>b.disabled=true);if(value===correct){btn.classList.add('correct');box.querySelector('.quiz-result').textContent='Correct — keep that exam point locked in.'}else{btn.classList.add('wrong');box.querySelector('.quiz-result').textContent='Not quite. Re-read the highlighted definition and try it again.'}}
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();if(!q)return render();const matches=Object.entries(pages).filter(([id,p])=>(p.title+' '+p.sub+' '+p.group).toLowerCase().includes(q));document.getElementById('app').innerHTML=`<div class="page-head"><h1>Search results</h1><p>${matches.length} lesson${matches.length===1?'':'s'} match “${e.target.value}”.</p></div><div class="grid">${matches.map(([id,p])=>`<div class="card unit-card" onclick="go('${id}')"><div class="tag">${p.group}</div><h3>${p.title}</h3><p>${p.sub}</p><div class="arrow">Open →</div></div>`).join('')}</div>`});window.addEventListener('hashchange',render);render();
</script></body></html>
